plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gautamnc.smartblindstick'
    compileSdk 34

    defaultConfig {
        applicationId "com.gautamnc.smartblindstick"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Production cloud default URL, overridable via gradle property (-PDEFAULT_BACKEND_URL="...")
        def defaultBackendUrl = project.findProperty("DEFAULT_BACKEND_URL") ?: System.getenv("DEFAULT_BACKEND_URL") ?: "https://smart-blind-stick.onrender.com/app"
        buildConfigField "String", "DEFAULT_BACKEND_URL", "\"${defaultBackendUrl}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
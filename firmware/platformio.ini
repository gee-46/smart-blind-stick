; ==============================================================================
; DRISHTIGUARD — ESP32 Smart Blind Stick Firmware (PlatformIO Configuration)
; ==============================================================================

[platformio]
default_envs = esp32_stick

[env:esp32_stick]
platform = espressif32@^6.5.0
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    electroniccats/MPU6050 @ ^1.3.1
    mikalhart/TinyGPSPlus @ ^1.0.3
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; Serial monitor filtering
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; ==============================================================================
; ESP32-CAM AI Vision Companion Node
; ==============================================================================
[env:esp32_cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
